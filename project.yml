name: Dokutresor
options:
  bundleIdPrefix: com.emmrich
  deploymentTarget:
    iOS: '17.0'
targets:
  Dokutresor:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Dokutresor
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.emmrich.dokutresor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1,2
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: Dokutresor/Dokutresor.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XK87E2B3VR
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Dokutresor benötigt Kamerazugriff, um Dokumente zu scannen.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Dokutresor benötigt Zugriff auf deine Fotos, um Dokumente zu importieren.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Dokutresor nutzt Face ID, um deine Dokumente vor unbefugtem Zugriff zu schützen.
  DokutresorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: DokutresorTests
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XK87E2B3VR
    dependencies:
    - target: Dokutresor
schemes:
  Dokutresor:
    build:
      targets:
        Dokutresor: all
        DokutresorTests: [test]
    test:
      config: Debug
      targets:
      - DokutresorTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
